<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#0F1016" />
      <stop offset="100%" stop-color="#181028" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.3" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7C3AED" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background rounded squircle with dark Persian aesthetic -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle border outline -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#4C1D95" stroke-width="3" stroke-opacity="0.4" />

  <!-- Centered Iconic Elements (Calendar sheet + Checkmark + Sprout for calm daily progress) -->
  <g filter="url(#shadow)">
    <!-- Calendar Card Base -->
    <rect x="116" y="126" width="280" height="260" rx="36" fill="#181926" stroke="#312E81" stroke-width="4" />

    <!-- Calendar Header Bar with Accent Gradient -->
    <path d="M 116 162 C 116 142.1 132.1 126 152 126 L 360 126 C 379.9 126 396 142.1 396 162 L 396 196 L 116 196 Z" fill="url(#accentGrad)" />

    <!-- Calendar Rings -->
    <rect x="180" y="104" width="20" height="44" rx="10" fill="#DDD6FE" />
    <rect x="312" y="104" width="20" height="44" rx="10" fill="#DDD6FE" />

    <!-- Dynamic Checkmark & Calm Sun Ray Arc -->
    <!-- Large prominent completed checkmark -->
    <path d="M 190 295 L 236 341 L 326 235" fill="none" stroke="url(#accentGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Small gentle calm sparkle dot -->
    <circle cx="340" cy="161" r="7" fill="#F5F3FF" />
  </g>
</svg>
