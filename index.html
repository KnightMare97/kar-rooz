<!doctype html>
<html lang="fa" dir="rtl" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>کار روز | KarRooz - مدیریت آرام کارهای روزانه</title>
    <meta name="description" content="برنامه مدیریت آرام کارهای روزانه و ثبت سریع یادداشت‌ها به زبان فارسی با ذخیره‌سازی محلی." />
    <meta property="og:title" content="کار روز | KarRooz - مدیریت آرام کارهای روزانه" />
    <meta property="og:description" content="برنامه مدیریت آرام کارهای روزانه و ثبت سریع یادداشت‌ها به زبان فارسی با ذخیره‌سازی محلی." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('karrooz_settings');
          var mode = 'dark';
          var accent = 'violet';
          var density = 'comfortable';
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed.themeMode === 'light') mode = 'light';
            else if (parsed.themeMode === 'system') {
              mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            if (parsed.accentColor) accent = parsed.accentColor;
            if (parsed.cardDensity) density = parsed.cardDensity;
          }
          var root = document.documentElement;
          root.className = mode;
          root.setAttribute('data-theme', mode);
          root.setAttribute('data-accent', accent);
          root.setAttribute('data-density', density);
          root.style.colorScheme = mode;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-accent selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
